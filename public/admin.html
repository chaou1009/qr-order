<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b19">
<title>Back office</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { background: var(--bg); min-height: 100vh; }
  .top { position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); flex-wrap: wrap; }
  .top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; color: #fff; padding: 8px 14px; border-radius: 9px; font-weight: 700; font-size: 15px; }
  .seg button.on { background: #fff; color: var(--ink); }
  .pill { border: 1px solid rgba(255,255,255,.25); background: none; color: #fff; padding: 7px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; text-decoration: none; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px 16px 60px; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 4px 0 14px; flex-wrap: wrap; }
  .bar h2 { margin: 0; font-size: 20px; flex: 1; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: #b42318; border-color: #f3c1bd; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; }
  input[type=text], input[type=number], input[type=password], select, textarea { font: inherit; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
  textarea { resize: vertical; min-height: 56px; }
  .cat { margin-bottom: 22px; }
  .cat h3 { font-size: 16px; margin: 0 0 8px; color: var(--ink-2); }
  .dish { background: var(--surface); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; border: 1px solid var(--line); }
  .dish.off { opacity: .6; }
  .thumb { width: 64px; height: 64px; border-radius: 12px; background: var(--chip) center/cover no-repeat; display: grid; place-items: center; color: var(--muted-2); font-size: 11px; }
  .dname { font-weight: 800; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dsub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 10px; }
  .field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .field input { width: 86px; padding: 6px 8px; }
  .chips { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .chips button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .chips button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .chips button.on.red { background: #b42318; color: #fff; }
  .chips button.on.amber { background: #c77700; color: #fff; }
  .switch { position: relative; display: inline-block; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--muted-2); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::after { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: #1e9e4a; }
  .switch input:checked + span::after { transform: translateX(18px); }
  .tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .tag.red { background: #fde2e1; color: #b42318; }
  .tag.amber { background: #fff4d6; color: #8a5a00; }
  .tag.star { background: #fff1c2; color: #8a5a00; }
  .tag.blue { background: #e3edff; color: #1d4ed8; }
  .btn.on-star { background: #fff1c2; border-color: #f5d26b; color: #8a5a00; }
  .mv { display: inline-flex; gap: 4px; }
  .dish:first-of-type [data-mv="-1"], .dish:last-of-type [data-mv="1"] { opacity: .35; pointer-events: none; }
  .tplrow .ch-list { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tplpick { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--bg); margin-bottom: 6px; cursor: pointer; }
  .tplpick input { width: auto; margin-top: 3px; }
  .tplpick small { display: block; color: var(--muted); }
  .tplbox .og [data-gdel] { display: none; }
  .tag.grey { background: var(--chip); color: var(--muted); }
  .held { font-size: 12px; color: #8a5a00; }
  .row { background: var(--surface); border-radius: 14px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 160px; }
  .tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-width: 260px; }
  @media (max-width: 640px) { .tri { grid-template-columns: 1fr; } }
  .lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 4px; display: block; }
  .tok { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .theme { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); text-align: left; padding: 0; }
  .theme .sw { background-size: cover; }
  .theme.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .theme .sw { height: 74px; display: grid; place-items: center; color: #fff; font-weight: 800; padding: 6px 10px; text-align: center; font-size: 13px; }
  .theme .tn { padding: 10px 12px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  .theme .when { display: block; padding: 0 12px 12px; font-size: 12px; color: var(--muted); }

  .modal { position: fixed; inset: 0; background: rgba(20,18,16,.5); z-index: 50; display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
  .modal.show { display: flex; }
  .box { background: var(--surface); border-radius: 18px; width: 100%; max-width: 720px; padding: 18px; }
  .box h3 { margin: 0 0 14px; font-size: 19px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .sect { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
  .sect h4 { margin: 0 0 8px; font-size: 15px; }
  .img-pick { display: flex; gap: 12px; align-items: center; }
  .img-pick .thumb { width: 96px; height: 96px; }
  .og { background: var(--bg); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .og-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .ch { display: grid; grid-template-columns: 1fr 1fr 1fr 90px auto; gap: 6px; margin-top: 6px; align-items: center; }
  @media (max-width: 640px) { .ch { grid-template-columns: 1fr 1fr; } }
  .x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; }
  .foot { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; position: sticky; bottom: -24px; background: var(--surface); padding: 12px 0 14px; border-top: 1px solid var(--line); z-index: 2; }
  details.sect > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  details.sect > summary::-webkit-details-marker { display: none; }
  details.sect > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
  details.sect[open] > summary::before { transform: rotate(90deg); }
  details.sect > summary .sum { font-weight: 600; font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.sect > summary .tog { font-size: 12px; color: var(--accent); font-weight: 700; }
  details.sect[open] > summary { margin-bottom: 10px; }
  .applycat { margin-bottom: 14px; }
  .applycat .ah { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .applycat .ah b { flex: 1; }
  .applygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  .applygrid label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--bg); cursor: pointer; font-size: 14px; }
  .applygrid input { width: auto; }
  .applygrid label.on { background: #e3edff; }
  .applygrid label.inguse .grow { flex: 1; }
  .applygrid label.inguse .per { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .applygrid label.inguse .per input { width: 52px; padding: 4px 6px; }
  .ingrow .st { width: 110px; }
  .ingrow .st input { width: 100%; }
  .foot .sp { flex: 1; }
  .login { max-width: 340px; margin: 14vh auto; background: var(--surface); padding: 24px; border-radius: 18px; text-align: center; }
  .login input { text-align: center; font-size: 24px; letter-spacing: .3em; margin: 14px 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 600; opacity: 0; transition: .2s; z-index: 80; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .req::after { content: ' *'; color: var(--accent); }
</style>

async function api(url, opt = {}) {
  const o = { ...opt, headers: { 'Content-Type': 'application/json' } }; if (opt.body && typeof opt.body !== 'string') o.body = JSON.stringify(opt.body);
  const r = await fetch(url, o); const data = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== '/api/staff/login') { showLogin(); throw Object.assign(new Error('login'), { status: 401, data }); }
  if (!r.ok) throw Object.assign(new Error(data.error || 'err'), { status: r.status, data });
  return data;
}

let view = store.get('adminView', 'dishes'), menu = [], tables = [], theme = 'default', themes = [], banners = {}, effects = true, shop = { name: '', logo: null }, tpls = [], ings = [], hideSoldOut = false;
const VIEWS = ['dishes', 'ings', 'tpls', 'cats', 'tables', 'theme', 'shop'];
function labels() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  document.title = tr('title'); $('title').textContent = tr('title'); $('toStaff').textContent = tr('toStaff'); $('langBtn').textContent = LANG_LABEL[lang];
  $('tabs').innerHTML = VIEWS.map((v) => `<button data-v="${v}" class="${v === view ? 'on' : ''}">${esc(tr(v))}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { view = b.dataset.v; store.set('adminView', view); labels(); load(); });
}
$('langBtn').onclick = () => { lang = LANGS[(LANGS.indexOf(lang) + 1) % 3]; store.set('staffLang', lang); labels(); draw(); };

function showLogin(msg) {
  $('top').hidden = true; $('modal').classList.remove('show');
  $('main').innerHTML = `<form class="login" id="lf"><h2 style="margin:0">${esc(tr('login'))}</h2><p class="hint" style="margin:6px 0 0">${esc(tr('loginSub'))}</p>
    <input type="password" inputmode="numeric" autocomplete="current-password" id="pin" autofocus><div class="hint" style="color:#b42318">${esc(msg || '')}</div>
    <button class="btn primary" style="width:100%;justify-content:center;padding:13px">${esc(tr('enter'))}</button>
    <div style="margin-top:14px">${LANGS.map((l) => `<button type="button" class="btn small" data-lg="${l}">${LANG_LABEL[l]}</button>`).join(' ')}</div></form>`;
  $('main').querySelectorAll('[data-lg]').forEach((b) => b.onclick = () => { lang = b.dataset.lg; store.set('staffLang', lang); showLogin(); });
  $('lf').onsubmit = async (e) => { e.preventDefault();
    try { await api('/api/staff/login', { method: 'POST', body: { pin: $('pin').value, role: 'admin' } }); start(); }
    catch (er) { showLogin(er.status === 429 ? tr('tooMany') : tr('badPin')); } };
}

async function load() {
  try {
    if (view === 'dishes' || view === 'cats' || view === 'ings') ({ categories: menu, hideSoldOut } = await api('/api/admin/menu'));
    if (view === 'dishes' || view === 'tpls') tpls = (await api('/api/admin/option-templates')).templates;
    if (view === 'dishes' || view === 'ings') ings = (await api('/api/admin/ingredients')).ingredients;
    if (view === 'tables') tables = (await api('/api/admin/tables')).tables;
    if (view === 'shop') shop = await api('/api/admin/shop');
    if (view === 'theme') ({ theme, themes, banners, effects } = await api('/api/admin/theme'));
    draw();
  } catch (e) { if (e.status !== 401) toast(tr('err')); }
}
function draw() {
  if ($('top').hidden) return;
  ({ dishes: drawDishes, ings: drawIngs, tpls: drawTpls, cats: drawCats, tables: drawTables, theme: drawTheme, shop: drawShop })[view]();
}

const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
const daysText = (days) => tr('dayPre') + DAY_ORDER.filter((x) => days.includes(x)).map((x) => tr('d' + x)).join(tr('dayJoin'));
function dishTags(d) {
  const sp = d.special || { mode: 'none', days: [], active: false };
  return (sp.active ? `<span class="tag star">★ ${esc(tr('specialTag'))}</span>` : '') + (sp.mode === 'weekly' ? `<span class="tag star" style="opacity:.8">${esc(tr('spDaysTag', { d: daysText(sp.days) }))}</span>` : '') + (d.days && d.days.length ? `<span class="tag blue">${esc(tr('onlyDays', { d: daysText(d.days) }))}</span>` : '')

}
function dishStatus(d) {
  if (!d.listed) return `<span class="tag grey">${esc(tr('unlisted'))}</span>`;
  if (d.soldOut === 'until') return `<span class="tag red">${esc(tr('soldUntilTag'))}</span>`;
  if (d.soldOut === 'today') return `<span class="tag amber">${esc(tr('soldTodayTag'))}</span>`;
  if (d.portions != null && d.portions <= 0) return `<span class="tag red">${esc(tr('stockOut'))}</span>`;
  if (d.portions != null) return `<span class="tag amber">${esc(tr('left', { n: d.portions }))}</span>`;
  return '';
}

// Resize the photo in the browser (max 1000px, JPEG) so uploads stay small even from a phone camera.
function shrink(file, max = 1000, type = 'jpeg') {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const g = c.getContext('2d'); if (type === 'jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(type === 'png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); }; img.src = url;
  });
}

// Keep the dish list live (portions left, sold out after orders) without disturbing what staff are typing.
const sig = (d) => JSON.stringify(d);
setInterval(async () => {
  if ($('top').hidden || view !== 'dishes' || document.hidden || $('modal').classList.contains('show')) return;
  let fresh; try { fresh = (await api('/api/admin/menu')).categories; } catch { return; }
  const oldIds = menu.map((c) => c.id + ':' + c.items.map((i) => i.id).join(',')).join('|'), newIds = fresh.map((c) => c.id + ':' + c.items.map((i) => i.id).join(',')).join('|');
  if (oldIds !== newIds) { if (!document.activeElement?.closest('.dish')) { menu = fresh; drawDishes(); } return; }
  fresh.forEach((c, ci) => c.items.forEach((it, ii) => {
    const cur = menu[ci].items[ii]; if (sig(cur) === sig(it)) return;
    const el = document.querySelector(`.dish[data-id="${it.id}"]`); if (!el || el.contains(document.activeElement)) return;
    menu[ci].items[ii] = it; const w = document.createElement('div'); w.innerHTML = dishRow(it); el.replaceWith(w.firstElementChild);
  }));
  drawDishesBind();
}, 4000);
$('modal').onclick = (e) => { if (e.target === $('modal')) $('modal').classList.remove('show'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').classList.remove('show'); });
async function start() { $('top').hidden = false; if (!VIEWS.includes(view)) view = 'dishes'; labels(); await load(); }
start();
</script>
