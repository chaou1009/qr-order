<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌台二维码</title>
<link rel="stylesheet" href="/app.css">
<script src="/vendor/qrcode.js"></script>
<style>
  .bar { max-width: 1000px; margin: 0 auto; padding: 20px 16px 8px; }
  .bar h1 { margin: 0 0 6px; font-size: 22px; }
  .bar p { margin: 4px 0; color: var(--muted); font-size: 14px; }
  .warn { background: #fff4d6; color: #7a4f00; padding: 10px 14px; border-radius: 12px; margin-top: 10px; font-size: 14px; }
  .print { margin-top: 12px; border: 0; background: var(--accent); color: #fff; font-weight: 700; padding: 12px 22px; border-radius: 12px; font-size: 15px; }
  .grid { max-width: 1000px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 20px; padding: 22px 18px 18px; text-align: center; border: 1px solid var(--line); break-inside: avoid; page-break-inside: avoid; }
  .card .rn { font-weight: 700; font-size: 15px; color: var(--muted); }
  .card .tn { font-size: 40px; font-weight: 800; line-height: 1.1; margin: 4px 0 10px; }
  .card .tn small { font-size: 16px; font-weight: 700; color: var(--muted); display: block; letter-spacing: .08em; }
  .card .qr { width: 180px; height: 180px; margin: 0 auto; }
  .card .qr svg, .card .qr img { width: 100%; height: 100%; display: block; }
  .card .cta { margin-top: 12px; background: var(--accent); color: #fff; border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
  .card .sub { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.5; }
  .card .url { margin-top: 6px; font-size: 9px; color: var(--muted-2); word-break: break-all; }
  @media print {
    body { background: #fff; } .bar { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10mm; padding: 0; }
    .card { border: 1px dashed #bbb; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  .lg { display: block; max-height: 60px; max-width: 80%; margin: 0 auto 6px; object-fit: contain; }
</style>
</head>
<body>
<div class="bar">
  <h1>桌台二维码</h1>
  <p>每张桌子一个固定二维码，打印后贴在桌上即可长期使用。二维码里是一串随机码，客人改网址里的桌号也无法冒用别的桌。</p>
  <p>请在正式域名下打开此页再打印（二维码会使用当前网址）。</p>
  <div id="hostWarn"></div>
  <button class="print" onclick="print()">打印全部</button>
</div>
<div class="grid" id="grid">加载中…</div>
<script>
'use strict';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
(async () => {
  const [r, c] = await Promise.all([fetch('/api/staff/tables'), fetch('/api/config').then((x) => x.json())]);
  const isLocal = /^(localhost|127\.)/.test(location.hostname);
  const base = c.publicUrl || (isLocal && c.lanUrl ? c.lanUrl : location.origin);
  if (!c.publicUrl && /^(localhost|127\.|192\.168\.|10\.|172\.)/.test(location.hostname)) {
    document.getElementById('hostWarn').innerHTML = '<div class="warn">现在用的是店内局域网地址（' + esc(base.replace(/^https?:\/\//, '')) + '），手机必须连上和这台电脑同一个 WiFi 才能打开。正式上线有了域名后，请在正式网址下重新打印。</div>';
  }
  if (r.status === 401) { document.getElementById('grid').innerHTML = '请先在 <a href="/staff">/staff</a> 登录，再回到此页。'; return; }
  const { tables } = await r.json();
  document.getElementById('grid').innerHTML = tables.filter((t) => t.active).map((t) => {
    const url = base + '/t/' + t.token;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    return `<div class="card">${c.logo ? `<img class="lg" src="${esc(c.logo)}" alt="${esc(c.name)}">` : `<div class="rn">${esc(c.name)}</div>`}<div class="tn"><small>TABLE · MEJA · 桌</small>${esc(t.name)}</div>
      <div class="qr">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
      <div class="cta">Scan to order</div><div class="sub">Imbas untuk memesan · 扫码点餐<br>Pay at counter · Bayar di kaunter · 柜台付款</div>
      <div class="url">${esc(url)}</div></div>`;
  }).join('');
})();
</script>
</body>
</html>
