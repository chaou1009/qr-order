<style>
  body { background: var(--bg); min-height: 100vh; }
  .top { position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); flex-wrap: wrap; }
  .top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: none; color: #fff; padding: 8px 16px; border-radius: 9px; font-weight: 700; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .seg button.on { background: #fff; color: var(--ink); }
  .count { background: var(--accent); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; font-size: 12px; display: inline-grid; place-items: center; padding: 0 6px; }

  .line .o { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  .line .nt { font-size: 14px; margin-top: 3px; background: #fff4d6; color: #7a4f00; padding: 2px 8px; border-radius: 6px; display: inline-block; font-weight: 600; }
  .done-btn { width: 100%; margin-top: 10px; border: 0; background: #1e9e4a; color: #fff; font-weight: 800; font-size: 17px; padding: 14px; border-radius: 12px; display: flex; justify-content: center; gap: 8px; align-items: center; }
  .done-btn:active { transform: scale(.98); }
  .done-btn svg { width: 22px; height: 22px; }
  .ta { display: inline-block; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; padding: 2px 10px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
  .tarow { margin: 0 0 6px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
  .void-btn { border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 8px 4px 0; display: block; margin: 0 auto; }
  .tag.void { background: var(--chip); color: var(--muted); }
  .otot { text-align: right; font-size: 14px; color: var(--muted); margin-top: 4px; }

  .empty { text-align: center; padding: 18vh 16px; color: var(--muted); }
  .empty svg { width: 72px; height: 72px; color: var(--muted-2); }
  .empty h2 { color: var(--ink); margin: 12px 0 4px; }

  .hist-bar input { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .hist-bar .sum { margin-left: auto; color: var(--muted); font-size: 14px; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; }
  .hrow { background: var(--surface); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: start; }

  .hrow .meta { font-size: 13px; color: var(--muted); }

  .hrow .its .o { color: var(--muted); font-size: 13px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.done { background: #e6f4ea; color: #1e7a3c; }
  .tag.new { background: var(--accent-soft); color: var(--accent-ink); }
  .undo-link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px 0; margin-top: 6px; display: block; }

  .tgrid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .tile { border: 0; text-align: left; background: var(--surface); border-radius: 18px; padding: 14px 16px; min-height: 130px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 2px solid transparent; }

  .tile .tn small { font-size: 13px; color: var(--muted); font-weight: 600; margin-right: 4px; }
  .tile .st { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: auto; }
  .tile .amt { font-size: 18px; font-weight: 800; }

  .tile .pend { align-self: flex-start; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .tile.idle { opacity: .7; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 45; display: grid; place-items: center; padding: 16px; }

  .banner.alt { background: #1f6feb; box-shadow: 0 10px 30px rgba(31,111,235,.4); }
  .busy-pill.lv1 { background: #f5b301; color: #1d1b19; border-color: #f5b301; }
  .busy-pill.lv2 { background: #e5484d; border-color: #e5484d; }

  .req.remind { background: #fff1e8; border-color: var(--accent); }

  .req.remind .req-ic { background: var(--accent); }
  .req-body { flex: 1; min-width: 0; font-size: 15px; }
  .req-h b { font-size: 17px; }
  .req .o { color: var(--muted); font-size: 13px; }
  .req-w { margin-top: 2px; font-weight: 600; }
  .req-ok { border: 0; background: var(--ink); color: #fff; font-weight: 800; padding: 10px 14px; border-radius: 12px; display: flex; gap: 6px; align-items: center; flex: none; }
  .req-ok svg { width: 18px; height: 18px; }
  .banner.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

const L = (o) => (o && (o[lang] || (lang === 'ms' ? o.en : null) || o.zh || o.en || Object.values(o)[0])) || '';
const hhmm = (ms) => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BAG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';
const BELL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
const CLOCK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

let view = 'live', orders = [], requests = [], seen = null, seenReq = null, freshTables = new Set(), soundOn = store.get('staffSound', true);
let serverSkew = 0, pollTimer = null, busy = { level: 0, extra: 0 }, restaurantName = '';

async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---------- static labels ----------
function applyLabels() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  $('title').textContent = (restaurantName ? restaurantName + ' · ' : '') + tr('title');
  $('tabLive').firstChild.textContent = tr('pending') + ' ';
  $('tabTables').textContent = tr('tables'); $('tabHist').textContent = tr('history');
  $('qrLink').textContent = tr('qr'); $('langBtn').textContent = LANG_LABEL[lang];
  $('connPill').title = tr('conn'); $('toastBtn').textContent = tr('undo');
  renderSoundBtn(); renderBusyBtn(); renderRequests();
}

// ---------- sound (Web Audio; needs one tap to unlock on tablets) ----------
let ctx = null;
function tone(notes) {
  if (!soundOn || !ctx) return;
  const now = ctx.currentTime;
  notes.forEach(([f, t]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(0.5, now + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.5);
    o.connect(g).connect(ctx.destination); o.start(now + t); o.stop(now + t + 0.55);
  });
}
const chime = () => tone([[880, 0], [1175, 0.18], [1568, 0.36], [880, 0.9], [1175, 1.08], [1568, 1.26]]);
const ding = () => tone([[1318, 0], [988, 0.25], [1318, 0.6], [988, 0.85]]); // guest request: a different, two-tone ring
function renderSoundBtn() { $('soundBtn').textContent = soundOn ? tr('soundOn') : tr('soundOff'); }
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('staffSound', soundOn); renderSoundBtn(); if (soundOn) chime(); };
$('langBtn').onclick = () => { lang = LANG_ORDER[(LANG_ORDER.indexOf(lang) + 1) % 3]; store.set('staffLang', lang); $('banner').classList.remove('show'); applyLabels(); setView(view); };

// ---------- kitchen busy level (shown to guests) ----------
function renderBusyBtn() { const b = $('busyBtn'); b.textContent = tr('busy' + busy.level); b.className = 'pill busy-pill lv' + busy.level; }
$('busyBtn').onclick = async () => {
  try { const r = await api('/api/staff/busy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level: (busy.level + 1) % 3 }) });
    busy = r.busy; renderBusyBtn(); showToast(busy.level ? tr('busySet', { m: busy.extra }) : tr('busySet0'), null);
  } catch {}
};

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); poll(); } });

function showStart() {
  $('overlay').style.display = 'grid';
  $('overlay').innerHTML = `<div><h2>${esc(tr('start'))}</h2><p>${esc(tr('startSub'))}</p><button class="big" id="startBtn">${esc(tr('start'))}</button></div>`;
  $('startBtn').onclick = () => {
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
    $('overlay').style.display = 'none'; keepAwake(); chime(); poll(); if (!pollTimer) pollTimer = setInterval(poll, 4000);
  };
}

// ---------- login ----------
let pin = '';
function showLogin() {
  pin = '';
  $('overlay').style.display = 'grid';
  const draw = (err = '') => {
    $('overlay').innerHTML = `<div><h2>${esc(tr('login'))}</h2><p>${esc(tr('loginSub'))}</p><div class="pin-dots">${[0,1,2,3,4,5].slice(0, Math.max(4, pin.length)).map((i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map((k) => `<button data-k="${k}">${k}</button>`).join('')}</div><div class="err">${esc(err)}</div>
      <div style="margin-top:18px;display:flex;gap:8px;justify-content:center">${LANG_ORDER.map((k) => `<button class="pill" data-lg="${k}">${LANG_LABEL[k]}</button>`).join('')}</div></div>`;
    $('overlay').querySelectorAll('[data-k]').forEach((b) => b.onclick = async () => {
      const k = b.dataset.k;
      if (k === '⌫') pin = pin.slice(0, -1); else if (k === '✓') return submit(); else if (pin.length < 8) pin += k;
      draw();
    });
    $('overlay').querySelectorAll('[data-lg]').forEach((b) => b.onclick = () => { lang = b.dataset.lg; store.set('staffLang', lang); applyLabels(); draw(); });
  };
  const submit = async () => {
    const r = await fetch('/api/staff/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
    if (r.ok) { pin = ''; showStart(); } else { pin = ''; draw(r.status === 429 ? tr('tooMany') : tr('badPin')); }
  };
  draw();
}

// ---------- polling ----------
const recentlyUndone = new Set();
async function poll() {
  try {
    const j = await api('/api/staff/orders');
    serverSkew = j.now - Date.now();
    const ids = new Set(j.orders.map((o) => o.id)), rids = new Set(j.requests.map((r) => r.id));
    if (seen) {
      const added = j.orders.filter((o) => !seen.has(o.id) && !recentlyUndone.has(o.id));
      if (added.length) {
        added.forEach((o) => freshTables.add(o.table));
        chime(); banner(tr('newOrder', { t: [...new Set(added.map((o) => o.table))].join(', ') }));
        setTimeout(() => { added.forEach((o) => freshTables.delete(o.table)); }, 60000);
      }
    }
    if (seenReq) {
      const addedR = j.requests.filter((r) => !seenReq.has(r.id));
      if (addedR.length) { ding(); banner(tr('newReq', { t: [...new Set(addedR.map((r) => r.table))].join(', ') }), true); }
    }
    recentlyUndone.clear();
    seen = ids; seenReq = rids; orders = j.orders; requests = j.requests;
    if (j.busy.level !== busy.level) { busy = j.busy; renderBusyBtn(); }
    $('netDot').classList.remove('off');
    $('liveCount').textContent = orders.length;
    document.title = (orders.length + requests.length ? `(${orders.length + requests.length}) ` : '') + tr('title');
    renderRequests();
    if (view === 'live') render(); else if (view === 'tables') renderTables();
  } catch (e) { if (e.message !== 'login') $('netDot').classList.add('off'); }
}

// ---------- guest requests (call staff / food reminder) ----------
function renderRequests() {
  const box = $('reqs');
  if (!requests.length) { box.innerHTML = ''; box.style.display = 'none'; return; }
  const now = Date.now() + serverSkew;
  box.style.display = '';
  box.innerHTML = `<div class="req-title">${esc(tr('reqTitle'))}</div><div class="req-list">${requests.map((r) => {
    const ago = Math.floor((now - r.createdAt) / 60000);
    const what = r.type === 'call' ? esc(tr('r' + r.detail.reason))
      : r.detail.items.map((i) => `${i.qty}× ${esc(L(i.name))}${i.takeaway ? ` <span class="ta" style="font-size:12px">${esc(tr('takeaway'))}</span>` : ''} <span class="o">(#${i.seq}, ${esc(tr('orderedAgo', { n: Math.floor((now - i.orderedAt) / 60000) }))})</span>`).join('<br>');
    return `<div class="req ${r.type}"><div class="req-ic">${r.type === 'call' ? BELL : CLOCK}</div>
      <div class="req-body"><div class="req-h"><b>${esc(tr('tableN', { t: r.table }))}</b> · ${esc(tr(r.type === 'call' ? 'call' : 'remind'))} <span class="o">${ago < 1 ? esc(tr('justNow')) : esc(tr('minAgo', { n: ago }))}</span></div><div class="req-w">${what}</div></div>
      <button class="req-ok" data-req="${r.id}">${CHECK}${esc(tr('handled'))}</button></div>`; }).join('')}</div>`;
  box.querySelectorAll('[data-req]').forEach((b) => b.onclick = async () => {
    requests = requests.filter((r) => r.id !== Number(b.dataset.req)); renderRequests();
    try { await api(`/api/staff/requests/${b.dataset.req}/done`, { method: 'POST' }); } catch { poll(); }
  });
}

// ---------- live board ----------
// Age colour follows each order's usual cooking time (+ busy extra): amber near it, red past it.
function ageClass(o, min) { const due = Math.max(...o.lines.map((l) => l.cookMinutes || 15)) + busy.extra; return min >= due ? 'late' : min >= due * 0.7 ? 'warn' : ''; }
function lineHTML(l) {
  const opts = l.options.map((x) => L(x.choice)).join(' · ');
  return `<div class="line"><div class="q">${l.qty}×</div><div><div class="n">${esc(L(l.name))}${l.takeaway ? `<span class="ta">${esc(tr('takeaway'))}</span>` : ''}</div>${opts ? `<div class="o">${esc(opts)}</div>` : ''}${l.note ? `<div class="nt">${esc(tr('note'))}: ${esc(l.note)}</div>` : ''}</div></div>`;
}
function render() {
  if (view !== 'live') return;
  if (!orders.length) {
    $('view').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18M4.5 15a7.5 7.5 0 0 1 15 0"/><path d="M12 7.5V6M10.5 6h3M5 18h14"/></svg><h2>${esc(tr('empty'))}</h2><p>${esc(tr('emptySub'))}</p></div>`;
    return;
  }
  const byTable = new Map();
  orders.forEach((o) => { if (!byTable.has(o.table)) byTable.set(o.table, []); byTable.get(o.table).push(o); });
  const now = Date.now() + serverSkew;
  $('view').innerHTML = `<div class="board">${[...byTable.entries()].map(([tbl, list]) => `
    <div class="tcard${freshTables.has(tbl) ? ' fresh' : ''}">
      <div class="thead"><div class="tnum"><small>${esc(tr('tbl'))}</small>${esc(tbl)}</div><span style="color:var(--muted);font-size:14px">${esc(tr('nOrders', { n: list.length }))}</span></div>
      ${list.map((o) => { const min = Math.floor((now - o.createdAt) / 60000); return `<div class="order">
        <div class="ohead"><b>#${o.seq}</b><span>${hhmm(o.createdAt)}</span><span class="age ${ageClass(o, min)}">${min < 1 ? esc(tr('justNow')) : esc(tr('minAgo', { n: min }))}</span></div>
        ${o.lines.some((l) => l.takeaway) ? `<div class="tarow">${BAG} ${esc(tr(o.lines.every((l) => l.takeaway) ? 'taAll' : 'taSome'))}</div>` : ''}
        ${o.lines.map(lineHTML).join('')}
        <div class="otot">${esc(tr('total'))} ${rm(o.total)}</div>
        <button class="done-btn" data-done="${o.id}">${CHECK}${esc(tr('done'))}</button>
        <button class="void-btn" data-void="${o.id}">${esc(tr('voidBtn'))}</button></div>`; }).join('')}
    </div>`).join('')}</div>`;
  $('view').querySelectorAll('[data-done]').forEach((b) => b.onclick = () => markDone(Number(b.dataset.done)));
  $('view').querySelectorAll('[data-void]').forEach((b) => b.onclick = () => { if (confirm(tr('voidConfirm'))) markDone(Number(b.dataset.void), 'void'); });
}
async function markDone(id, action = 'done') {
  const o = orders.find((x) => x.id === id);
  orders = orders.filter((x) => x.id !== id); $('liveCount').textContent = orders.length; render();
  try { await api(`/api/staff/orders/${id}/${action}`, { method: 'POST' }); seen?.delete(id); }
  catch { if (o) { orders.push(o); orders.sort((a, b) => a.id - b.id); render(); } return; }
  showToast(tr(action === 'void' ? 'voidToast' : 'doneToast', { t: o?.table, s: o?.seq }), async () => { recentlyUndone.add(id); await api(`/api/staff/orders/${id}/undo`, { method: 'POST' }); poll(); });
}

// ---------- history ----------
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kuala_Lumpur' }).format(new Date());
let histDay = today();
async function renderHistory() {
  $('view').innerHTML = `<div class="hist-wrap"><div class="hist-bar"><button class="btn" id="prevDay">‹</button><input type="date" id="dayInput" value="${histDay}" max="${today()}"><button class="btn" id="nextDay">›</button><span class="sum" id="histSum"></span></div><div id="histList">${esc(tr('loading'))}</div></div>`;
  const shift = (d) => { const x = new Date(histDay + 'T12:00:00'); x.setDate(x.getDate() + d); histDay = x.toISOString().slice(0, 10); renderHistory(); };
  $('prevDay').onclick = () => shift(-1); $('nextDay').onclick = () => { if (histDay < today()) shift(1); };
  $('dayInput').onchange = (e) => { if (e.target.value) { histDay = e.target.value; renderHistory(); } };
  try {
    const j = await api('/api/staff/history?day=' + histDay);
    $('histSum').textContent = tr('nDay', { n: j.orders.length });
    $('histList').innerHTML = j.orders.length ? j.orders.map((o) => `<div class="hrow">
      <div><div class="tb">${esc(tr('tableN', { t: o.table }))}</div><div class="meta">#${o.seq} · ${hhmm(o.createdAt)}</div></div>
      <div class="its">${o.lines.map((l) => `<div>${l.qty} × ${esc(L(l.name))}${l.takeaway ? `<span class="ta" style="font-size:12px">${esc(tr('takeaway'))}</span>` : ''}${l.options.length ? ` <span class="o">(${esc(l.options.map((x) => L(x.choice)).join(' · '))})</span>` : ''}${l.note ? ` <span class="o">${esc(tr('note'))}: ${esc(l.note)}</span>` : ''}</div>`).join('')}<div class="meta" style="margin-top:4px">${esc(tr('total'))} ${rm(o.total)}</div></div>
      <div style="text-align:right">${o.status === 'done' ? `<span class="tag done">${esc(tr('enteredAt', { h: o.doneAt ? hhmm(o.doneAt) : '' }))}</span><button class="undo-link" data-undo="${o.id}">${esc(tr('backToPending'))}</button>`
        : o.status === 'void' ? `<span class="tag void">${esc(tr('voided'))}</span><button class="undo-link" data-undo="${o.id}">${esc(tr('restore'))}</button>` : `<span class="tag new">${esc(tr('pendingTag'))}</span>`}</div>
    </div>`).join('') : `<div class="empty" style="padding:10vh 0">${esc(tr('noDay'))}</div>`;
    $('histList').querySelectorAll('[data-undo]').forEach((b) => b.onclick = async () => { await api(`/api/staff/orders/${b.dataset.undo}/undo`, { method: 'POST' }); recentlyUndone.add(Number(b.dataset.undo)); renderHistory(); poll(); });
  } catch (e) { if (e.message !== 'login') $('histList').textContent = tr('loadErr'); }
}
function setView(v) { view = v; [['live', 'tabLive'], ['tables', 'tabTables'], ['hist', 'tabHist']].forEach(([k, id]) => $(id).classList.toggle('on', k === v));
  if (v === 'live') render(); else if (v === 'hist') renderHistory(); else renderTables(); }
$('tabLive').onclick = () => setView('live');
$('tabTables').onclick = () => setView('tables');
$('tabHist').onclick = () => setView('hist');

// ---------- tables: who is dining, clear table ----------
let tableData = null, openModal = null, lastModalJson = '';
const dur = (ms) => { const m = Math.max(0, Math.floor(ms / 60000)); return m < 60 ? tr('min', { n: m }) : tr('hm', { h: Math.floor(m / 60), m: m % 60 }); };
async function renderTables() {
  if (view !== 'tables') return;
  try { tableData = await api('/api/staff/table-status'); } catch { return; }
  if (view !== 'tables') return;
  const now = tableData.now;
  $('view').innerHTML = `<div class="tgrid">${tableData.tables.map((t) => { const s = t.session;
    return s ? `<button class="tile busy" data-t="${t.id}"><div class="tn"><small>${esc(tr('tbl'))}</small>${esc(t.name)}</div>${s.pending ? `<span class="pend">${esc(tr('nPending', { n: s.pending }))}</span>` : ''}
        <div class="amt">${rm(s.total)}</div><div class="st">${esc(tr('dining', { d: dur(now - s.openedAt) }))}</div></button>`
      : `<button class="tile idle" data-t="${t.id}"><div class="tn"><small>${esc(tr('tbl'))}</small>${esc(t.name)}</div><div class="st">${esc(tr('idle'))}</div></button>`; }).join('')}</div>
    <p style="text-align:center;color:var(--muted);font-size:13px;padding:0 16px 20px">${esc(tr('tablesHint', { h: tableData.autoCloseHours }))}</p>`;
  $('view').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => showTable(Number(b.dataset.t)));
  if (openModal) { const j = JSON.stringify(tableData.tables.find((x) => x.id === openModal)); if (j !== lastModalJson) showTable(openModal); }
}
function closeModal() { openModal = null; const m = document.querySelector('.modal-bg'); if (m) m.remove(); }
function showTable(id) {
  const t = tableData?.tables.find((x) => x.id === id); if (!t) return closeModal();
  openModal = id; lastModalJson = JSON.stringify(t); const s = t.session;
  const body = s ? s.orders.map((o) => `<div class="mo"><div class="meta"><b style="color:var(--ink)">#${o.seq}</b>${hhmm(o.createdAt)}
      ${o.status === 'done' ? `<span class="tag done">${esc(tr('entered'))}</span>` : o.status === 'void' ? `<span class="tag void">${esc(tr('voided'))}</span>` : `<span class="tag new">${esc(tr('pendingTag'))}</span>`}<span style="margin-left:auto">${rm(o.total)}</span></div>
      ${o.lines.map((l) => `<div>${l.qty} × ${esc(L(l.name))}${l.takeaway ? `<span class="ta" style="font-size:12px">${esc(tr('takeaway'))}</span>` : ''}</div>`).join('')}</div>`).join('') || `<p style="color:var(--muted)">${esc(tr('noOrderYet'))}</p>`
    : `<p style="color:var(--muted);padding:20px 0">${esc(tr('idleTable'))}</p>`;
  document.querySelector('.modal-bg')?.remove();
  const el = document.createElement('div'); el.className = 'modal-bg';
  el.innerHTML = `<div class="modal"><div class="modal-h"><h3>${esc(tr('tableN', { t: t.name }))} ${s ? `<span style="font-size:14px;color:var(--muted);font-weight:600">· ${esc(tr('diningFor', { d: dur(tableData.now - s.openedAt) }))}</span>` : ''}</h3><button class="btn" data-x>${esc(tr('close'))}</button></div>
    <div class="modal-b">${body}</div>
    ${s ? `<div class="modal-f"><div style="font-weight:800;font-size:18px">${esc(tr('total'))} ${rm(s.total)}</div><button class="clear-btn" data-clear="${s.id}">${esc(tr('clear'))}</button></div>` : ''}</div>`;
  document.body.appendChild(el);
  el.onclick = (e) => { if (e.target === el || e.target.closest('[data-x]')) closeModal(); };
  const cb = el.querySelector('[data-clear]');
  if (cb) cb.onclick = async () => {
    const warn = s.pending ? '\n\n' + tr('clearWarn', { n: s.pending }) : '';
    if (!confirm(tr('clearConfirm', { t: t.name }) + warn)) return;
    await api(`/api/staff/sessions/${s.id}/clear`, { method: 'POST' });
    closeModal(); renderTables(); showToast(tr('cleared', { t: t.name }), null);
  };
}

// ---------- misc ----------
let toastTimer, bannerTimer;
function showToast(msg, undo) {
  $('toastMsg').textContent = msg; $('toast').classList.add('show');
  $('toastBtn').style.display = undo ? '' : 'none';
  $('toastBtn').onclick = async () => { $('toast').classList.remove('show'); await undo(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 6000);
}
function banner(msg, alt) { $('banner').textContent = msg; $('banner').classList.toggle('alt', !!alt); $('banner').classList.add('show'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 6000); }
setInterval(() => { $('clock').textContent = hhmm(Date.now()); renderRequests(); if (view === 'live' && orders.length) render(); }, 30000);
$('clock').textContent = hhmm(Date.now());
applyLabels();

(async function init() {
  fetch('/api/config').then((r) => r.json()).then((c) => { restaurantName = c.name; applyLabels(); }).catch(() => {});
  const r = await fetch('/api/staff/orders');
  if (r.status === 401) showLogin(); else showStart();
})();
</script>
</body>
</html>
