<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>接单平板</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { background: var(--bg); min-height: 100vh; }
  .top { position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); flex-wrap: wrap; }
  .top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: none; color: #fff; padding: 8px 16px; border-radius: 9px; font-weight: 700; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .seg button.on { background: #fff; color: var(--ink); }
  .count { background: var(--accent); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; font-size: 12px; display: inline-grid; place-items: center; padding: 0 6px; }
  .pill { border: 1px solid rgba(255,255,255,.25); background: none; color: #fff; padding: 7px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ccf6e; }
  .dot.off { background: #f05252; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; opacity: .85; }

  .board { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .tcard { background: var(--surface); border-radius: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; border: 2px solid transparent; }
  .tcard.fresh { border-color: var(--accent); animation: glow 1.2s ease-in-out 4; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }
  .thead { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--chip); }
  .tnum { font-size: 26px; font-weight: 800; line-height: 1; }
  .tnum small { font-size: 13px; font-weight: 600; color: var(--muted); margin-right: 4px; }
  .order { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  .order:first-of-type { border-top: 0; }
  .ohead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  .ohead b { color: var(--ink); font-size: 15px; }
  .age { font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .age.warn { background: #fff4d6; color: #8a5a00; }
  .age.late { background: #fde2e1; color: #b42318; }
  .line { display: flex; gap: 10px; padding: 6px 0; font-size: 17px; }
  .line .q { font-weight: 800; min-width: 34px; color: var(--accent-ink); }
  .line .n { font-weight: 700; }
  .line .o { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  .line .nt { font-size: 14px; margin-top: 3px; background: #fff4d6; color: #7a4f00; padding: 2px 8px; border-radius: 6px; display: inline-block; font-weight: 600; }
  .done-btn { width: 100%; margin-top: 10px; border: 0; background: #1e9e4a; color: #fff; font-weight: 800; font-size: 17px; padding: 14px; border-radius: 12px; display: flex; justify-content: center; gap: 8px; align-items: center; }
  .done-btn:active { transform: scale(.98); }
  .done-btn svg { width: 22px; height: 22px; }
  .ta { display: inline-block; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; padding: 2px 10px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
  .tarow { margin: 0 0 6px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
  .void-btn { border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 8px 4px 0; display: block; margin: 0 auto; }
  .tag.void { background: var(--chip); color: var(--muted); }
  .otot { text-align: right; font-size: 14px; color: var(--muted); margin-top: 4px; }

  .empty { text-align: center; padding: 18vh 16px; color: var(--muted); }
  .empty svg { width: 72px; height: 72px; color: var(--muted-2); }
  .empty h2 { color: var(--ink); margin: 12px 0 4px; }

  .hist-wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .hist-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .hist-bar input { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .hist-bar .sum { margin-left: auto; color: var(--muted); font-size: 14px; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; }
  .hrow { background: var(--surface); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: start; }
  .hrow .tb { font-size: 22px; font-weight: 800; }
  .hrow .meta { font-size: 13px; color: var(--muted); }
  .hrow .its { font-size: 15px; }
  .hrow .its div { padding: 2px 0; }
  .hrow .its .o { color: var(--muted); font-size: 13px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.done { background: #e6f4ea; color: #1e7a3c; }
  .tag.new { background: var(--accent-soft); color: var(--accent-ink); }
  .undo-link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px 0; margin-top: 6px; display: block; }
  @media (max-width: 560px) { .hrow { grid-template-columns: 60px 1fr; } .hrow > :last-child { grid-column: 2; } }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(29,27,25,.96); color: #fff; display: grid; place-items: center; text-align: center; padding: 24px; }
  .overlay h2 { font-size: 26px; margin: 0 0 8px; }
  .overlay p { opacity: .75; margin: 0 0 24px; }
  .big { border: 0; background: var(--accent); color: #fff; font-size: 20px; font-weight: 800; padding: 18px 40px; border-radius: 16px; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 8px 0 24px; }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; }
  .pin-dots i.f { background: #fff; }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; justify-content: center; }
  .pad button { height: 76px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 28px; font-weight: 600; }
  .pad button:active { background: rgba(255,255,255,.3); }
  .err { color: #ff9b8a; min-height: 22px; margin-top: 12px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 160%); background: var(--ink); color: #fff; padding: 12px 14px 12px 18px; border-radius: 14px; display: flex; gap: 14px; align-items: center; transition: transform .25s; z-index: 40; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { border: 0; background: rgba(255,255,255,.15); color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 700; }
  .banner { position: fixed; top: 70px; left: 50%; transform: translate(-50%, -20px); opacity: 0; visibility: hidden; transition: all .3s; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; padding: 12px 22px; border-radius: 999px; z-index: 30; transition: transform .3s; box-shadow: 0 10px 30px rgba(226,85,43,.4); }
  .banner.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
</style>
</head>
<body>
<div class="top">
  <h1 id="title">接单</h1>
  <div class="seg"><button id="tabLive" class="on">待输入 <span class="count" id="liveCount">0</span></button><button id="tabHist">历史订单</button></div>
  <a class="pill" href="/staff/qr" target="_blank" style="text-decoration:none">二维码</a>
  <button class="pill" id="soundBtn">🔔 声音开</button>
  <button class="pill" id="langBtn">中 / EN</button>
  <span class="pill" title="连接状态"><span class="dot" id="netDot"></span><span class="clock" id="clock"></span></span>
</div>
<div id="view"></div>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">撤回</button></div>
<div class="overlay" id="overlay" style="display:none"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rm = (sen) => 'RM ' + (sen / 100).toFixed(2);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let nameLang = store.get('staffNameLang', 'zh');
const L = (o) => (o && (o[nameLang] || o.zh || o.en || Object.values(o)[0])) || '';
const hhmm = (ms) => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

let view = 'live', orders = [], seen = null, freshTables = new Set(), soundOn = store.get('staffSound', true);
let serverSkew = 0, pollTimer = null;

async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---------- sound (Web Audio chime; needs one tap to unlock on tablets) ----------
let ctx = null;
function chime() {
  if (!soundOn || !ctx) return;
  const now = ctx.currentTime;
  [[880, 0], [1175, 0.18], [1568, 0.36], [880, 0.9], [1175, 1.08], [1568, 1.26]].forEach(([f, t]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(0.5, now + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.5);
    o.connect(g).connect(ctx.destination); o.start(now + t); o.stop(now + t + 0.55);
  });
}
function renderSoundBtn() { $('soundBtn').textContent = soundOn ? '🔔 声音开' : '🔕 静音'; }
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('staffSound', soundOn); renderSoundBtn(); if (soundOn) chime(); };
$('langBtn').onclick = () => { nameLang = nameLang === 'zh' ? 'en' : 'zh'; store.set('staffNameLang', nameLang); render(); };

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); poll(); } });

function showStart() {
  $('overlay').style.display = 'grid';
  $('overlay').innerHTML = `<div><h2>开始接单</h2><p>点一下开始，平板会在新订单到达时响铃提醒，并保持屏幕常亮。</p><button class="big" id="startBtn">开始接单</button></div>`;
  $('startBtn').onclick = () => {
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
    $('overlay').style.display = 'none'; keepAwake(); chime(); poll(); if (!pollTimer) pollTimer = setInterval(poll, 4000);
  };
}

// ---------- login ----------
let pin = '';
function showLogin() {
  pin = '';
  $('overlay').style.display = 'grid';
  const draw = (err = '') => {
    $('overlay').innerHTML = `<div><h2>员工登录</h2><p>请输入员工密码</p><div class="pin-dots">${[0,1,2,3,4,5].slice(0, Math.max(4, pin.length)).map((i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map((k) => `<button data-k="${k}">${k}</button>`).join('')}</div><div class="err">${esc(err)}</div></div>`;
    $('overlay').querySelectorAll('[data-k]').forEach((b) => b.onclick = async () => {
      const k = b.dataset.k;
      if (k === '⌫') pin = pin.slice(0, -1); else if (k === '✓') return submit(); else if (pin.length < 8) pin += k;
      draw();
    });
  };
  const submit = async () => {
    const r = await fetch('/api/staff/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
    if (r.ok) { pin = ''; showStart(); } else { pin = ''; draw(r.status === 429 ? '尝试次数过多，请稍后再试' : '密码错误'); }
  };
  draw();
}

// ---------- live board ----------
async function poll() {
  try {
    const j = await api('/api/staff/orders');
    serverSkew = j.now - Date.now();
    const ids = new Set(j.orders.map((o) => o.id));
    if (seen) {
      const added = j.orders.filter((o) => !seen.has(o.id) && !recentlyUndone.has(o.id));
      if (added.length) {
        added.forEach((o) => freshTables.add(o.table));
        chime();
        const tbls = [...new Set(added.map((o) => o.table))].join('、');
        banner(`新订单：${tbls} 号桌`);
        setTimeout(() => { added.forEach((o) => freshTables.delete(o.table)); }, 60000);
      }
    }
    recentlyUndone.clear();
    seen = ids; orders = j.orders;
    $('netDot').classList.remove('off');
    $('liveCount').textContent = orders.length;
    document.title = (orders.length ? `(${orders.length}) ` : '') + '接单平板';
    if (view === 'live') render();
  } catch (e) { if (e.message !== 'login') $('netDot').classList.add('off'); }
}
const recentlyUndone = new Set();

function ageClass(min) { return min >= 15 ? 'late' : min >= 8 ? 'warn' : ''; }
function lineHTML(l) {
  const opts = l.options.map((x) => L(x.choice)).join(' · ');
  return `<div class="line"><div class="q">${l.qty}×</div><div><div class="n">${esc(L(l.name))}${l.takeaway ? '<span class="ta">外带</span>' : ''}</div>${opts ? `<div class="o">${esc(opts)}</div>` : ''}${l.note ? `<div class="nt">备注：${esc(l.note)}</div>` : ''}</div></div>`;
}
function render() {
  if (view !== 'live') return;
  if (!orders.length) {
    $('view').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18M4.5 15a7.5 7.5 0 0 1 15 0"/><path d="M12 7.5V6M10.5 6h3M5 18h14"/></svg><h2>暂无待输入订单</h2><p>新订单到达时会响铃提醒</p></div>`;
    return;
  }
  const byTable = new Map();
  orders.forEach((o) => { if (!byTable.has(o.table)) byTable.set(o.table, []); byTable.get(o.table).push(o); });
  const now = Date.now() + serverSkew;
  $('view').innerHTML = `<div class="board">${[...byTable.entries()].map(([tbl, list]) => `
    <div class="tcard${freshTables.has(tbl) ? ' fresh' : ''}">
      <div class="thead"><div class="tnum"><small>桌</small>${esc(tbl)}</div><span style="color:var(--muted);font-size:14px">${list.length} 张单</span></div>
      ${list.map((o) => { const min = Math.floor((now - o.createdAt) / 60000); return `<div class="order">
        <div class="ohead"><b>#${o.seq}</b><span>${hhmm(o.createdAt)}</span><span class="age ${ageClass(min)}">${min < 1 ? '刚刚' : min + ' 分钟前'}</span></div>
        ${o.lines.some((l) => l.takeaway) ? `<div class="tarow">🥡 此单有${o.lines.every((l) => l.takeaway) ? '全部' : '部分'}菜品外带</div>` : ''}
        ${o.lines.map(lineHTML).join('')}
        <div class="otot">合计 ${rm(o.total)}</div>
        <button class="done-btn" data-done="${o.id}">${CHECK}已输入收银机</button>
        <button class="void-btn" data-void="${o.id}">作废此单（恶作剧或重复下单）</button></div>`; }).join('')}
    </div>`).join('')}</div>`;
  $('view').querySelectorAll('[data-done]').forEach((b) => b.onclick = () => markDone(Number(b.dataset.done)));
  $('view').querySelectorAll('[data-void]').forEach((b) => b.onclick = () => { if (confirm('确定作废这张订单？作废后不会输入收银机。')) markDone(Number(b.dataset.void), 'void'); });
}
async function markDone(id, action = 'done') {
  const o = orders.find((x) => x.id === id);
  orders = orders.filter((x) => x.id !== id); $('liveCount').textContent = orders.length; render();
  try { await api(`/api/staff/orders/${id}/${action}`, { method: 'POST' }); seen?.delete(id); }
  catch { if (o) { orders.push(o); orders.sort((a, b) => a.id - b.id); render(); } return; }
  showToast(`${o ? o.table + ' 号桌 #' + o.seq : '订单'} ${action === 'void' ? '已作废' : '已完成'}`, async () => { recentlyUndone.add(id); await api(`/api/staff/orders/${id}/undo`, { method: 'POST' }); poll(); });
}

// ---------- history ----------
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kuala_Lumpur' }).format(new Date());
let histDay = today();
async function renderHistory() {
  $('view').innerHTML = `<div class="hist-wrap"><div class="hist-bar"><button class="btn" id="prevDay">‹</button><input type="date" id="dayInput" value="${histDay}" max="${today()}"><button class="btn" id="nextDay">›</button><span class="sum" id="histSum"></span></div><div id="histList">加载中…</div></div>`;
  const shift = (d) => { const x = new Date(histDay + 'T12:00:00'); x.setDate(x.getDate() + d); histDay = x.toISOString().slice(0, 10); renderHistory(); };
  $('prevDay').onclick = () => shift(-1); $('nextDay').onclick = () => { if (histDay < today()) shift(1); };
  $('dayInput').onchange = (e) => { if (e.target.value) { histDay = e.target.value; renderHistory(); } };
  try {
    const j = await api('/api/staff/history?day=' + histDay);
    $('histSum').textContent = `共 ${j.orders.length} 张单`;
    $('histList').innerHTML = j.orders.length ? j.orders.map((o) => `<div class="hrow">
      <div><div class="tb">${esc(o.table)}</div><div class="meta">#${o.seq} · ${hhmm(o.createdAt)}</div></div>
      <div class="its">${o.lines.map((l) => `<div>${l.qty} × ${esc(L(l.name))}${l.takeaway ? '<span class="ta" style="font-size:12px">外带</span>' : ''}${l.options.length ? ` <span class="o">(${esc(l.options.map((x) => L(x.choice)).join(' · '))})</span>` : ''}${l.note ? ` <span class="o">备注：${esc(l.note)}</span>` : ''}</div>`).join('')}<div class="meta" style="margin-top:4px">合计 ${rm(o.total)}</div></div>
      <div style="text-align:right">${o.status === 'done' ? `<span class="tag done">已输入 ${o.doneAt ? hhmm(o.doneAt) : ''}</span><button class="undo-link" data-undo="${o.id}">退回待输入</button>`
        : o.status === 'void' ? `<span class="tag void">已作废</span><button class="undo-link" data-undo="${o.id}">恢复</button>` : '<span class="tag new">待输入</span>'}</div>
    </div>`).join('') : '<div class="empty" style="padding:10vh 0">这一天没有订单</div>';
    $('histList').querySelectorAll('[data-undo]').forEach((b) => b.onclick = async () => { await api(`/api/staff/orders/${b.dataset.undo}/undo`, { method: 'POST' }); recentlyUndone.add(Number(b.dataset.undo)); renderHistory(); poll(); });
  } catch (e) { if (e.message !== 'login') $('histList').textContent = '加载失败，请重试'; }
}
$('tabLive').onclick = () => { view = 'live'; $('tabLive').classList.add('on'); $('tabHist').classList.remove('on'); render(); };
$('tabHist').onclick = () => { view = 'hist'; $('tabHist').classList.add('on'); $('tabLive').classList.remove('on'); renderHistory(); };

// ---------- misc ----------
let toastTimer, bannerTimer;
function showToast(msg, undo) {
  $('toastMsg').textContent = msg; $('toast').classList.add('show');
  $('toastBtn').onclick = async () => { $('toast').classList.remove('show'); await undo(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 6000);
}
function banner(msg) { $('banner').textContent = msg; $('banner').classList.add('show'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 6000); }
setInterval(() => { $('clock').textContent = hhmm(Date.now()); if (view === 'live' && orders.length) render(); }, 30000);
$('clock').textContent = hhmm(Date.now());
renderSoundBtn();

(async function init() {
  fetch('/api/config').then((r) => r.json()).then((c) => { $('title').textContent = c.name + ' · 接单'; }).catch(() => {});
  const r = await fetch('/api/staff/orders');
  if (r.status === 401) showLogin(); else showStart();
})();
</script>
</body>
</html>
