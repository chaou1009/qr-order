<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Menu</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { background: var(--bg); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  /* ---------- header ---------- */
  .hero { background: var(--surface); padding: 18px 16px 14px; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand.has-logo { flex-wrap: wrap; gap: 6px 12px; }
  .brand.has-logo .table-pill { margin-top: 0; }
  .brand-logo { display: block; max-height: 60px; max-width: min(200px, 48vw); width: auto; height: auto; object-fit: contain; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
  .brand h1 { font-size: 18px; margin: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .table-pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }
  .hero-actions { display: flex; gap: 8px; flex: none; }
  .icon-btn { height: 38px; min-width: 38px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }
  .act-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .orders-btn { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: var(--ink); color: var(--surface); font-weight: 800; font-size: 14px; padding: 11px 8px; border-radius: 14px; }
  .orders-btn svg { width: 18px; height: 18px; }
  .orders-btn b { background: var(--accent); color: #fff; border-radius: 999px; min-width: 20px; height: 20px; font-size: 12px; display: inline-grid; place-items: center; padding: 0 6px; }
  .orders-btn:disabled { background: var(--chip); color: var(--muted-2); }
  .call-btn { width: 100%; font-size: 14px !important; padding: 11px 8px !important; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent-ink); font-weight: 800; font-size: 15px; padding: 11px; border-radius: 14px; }
  .call-btn svg { width: 20px; height: 20px; }
  .call-btn:active { background: var(--accent-soft); }
  .call-btn.sent { border-color: #1e9e4a; color: #1e7a3c; background: #e6f4ea; }
  .notice { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  /* ---------- category tabs ---------- */
  .tabs { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .tabs-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .tabs-scroll::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; background: var(--chip); color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px; transition: background .15s, color .15s; }
  .tab.active { background: var(--ink); color: var(--surface); }

  /* ---------- menu ---------- */
  main { background: var(--bg); padding-top: 12px; }
  .section { background: var(--surface); margin: 0 0 14px; padding: 16px 16px 2px; scroll-margin-top: 66px; box-shadow: 0 1px 0 var(--line), 0 -1px 0 var(--line); }
  @media (min-width: 560px) { .section { margin: 0 10px 12px; border-radius: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); } }
  .section h2 { font-size: 19px; margin: 0; padding-bottom: 12px; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .section h2 .bar { width: 4px; height: 20px; border-radius: 2px; background: var(--accent); flex: none; }
  .section h2 .cnt { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--chip); padding: 2px 9px; border-radius: 999px; }
  body[data-theme] .section h2 .bar { display: none; }
  .section.specials { background: linear-gradient(180deg, var(--accent-soft), var(--surface) 140px); box-shadow: 0 0 0 2px var(--accent) inset; }
  @media (min-width: 560px) { .section.specials { box-shadow: 0 0 0 2px var(--accent) inset, 0 4px 14px rgba(0,0,0,.06); } }
  .section.specials h2 { color: var(--accent-ink); border-bottom-color: rgba(0,0,0,.06); padding-bottom: 4px; }
  .section.specials .sp-ic { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .section.specials .sp-ic svg { width: 16px; height: 16px; }
  .sp-sub { margin: 0 0 4px; font-size: 13px; color: var(--muted); padding-bottom: 8px; border-bottom: 2px solid rgba(0,0,0,.06); }
  body[data-theme] .section.specials h2::before { display: none; }
  .tab-sp { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; }
  .tab-sp svg { width: 14px; height: 14px; }
  .tab-sp.active { background: var(--accent); color: #fff; }

  .item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .item:last-child { border-bottom: 0; }
  .item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .item-desc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item-price { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: 15px; }
  .item-media { position: relative; width: 104px; height: 104px; flex: none; }
  .thumb { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; background: var(--chip); display: grid; place-items: center; color: var(--muted-2); }
  .thumb svg { width: 40px; height: 40px; }
  .add-btn { position: absolute; right: -6px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--bg); background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .add-btn svg { width: 18px; height: 18px; }
  .qty-badge { position: absolute; left: -6px; top: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
  .item.soldout { cursor: default; }
  .item.soldout .item-name, .item.soldout .item-price, .item.soldout .item-desc { color: var(--muted-2); }
  .item.soldout .thumb { filter: grayscale(1); opacity: .55; }
  .soldout-tag { position: absolute; inset: auto 0 8px 0; margin: auto; width: max-content; background: rgba(20,20,20,.78); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .stock-note { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 3px 8px; align-self: flex-start; }
  .stock-note.out { color: var(--muted); background: var(--chip); }
  .item.soldout .stock-note { color: var(--muted); background: var(--chip); }
  .footer-space { background: var(--bg); text-align: center; color: var(--muted-2); font-size: 12px; padding: 24px 16px; }

  /* ---------- cart bar ---------- */
  .cartbar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30; max-width: 640px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--surface); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transform: translateY(140%); transition: transform .25s cubic-bezier(.2,.8,.2,1); border: 0; width: auto; text-align: left; }
  .cartbar.show { transform: none; }
  .bag { position: relative; width: 28px; height: 28px; }
  .bag svg { width: 28px; height: 28px; }
  .bag b { position: absolute; top: -6px; right: -8px; background: var(--accent); color: #fff; font-size: 11px; min-width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px; }
  .cartbar .total { flex: 1; font-weight: 800; font-size: 17px; }
  .cartbar .go { background: var(--accent); color: #fff; font-weight: 700; padding: 11px 18px; border-radius: 12px; font-size: 15px; }
  .bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.18); } }

  /* ---------- sheets ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 640px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0;
    max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: none; }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; flex: 1; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; }
  .sheet-head h3 { margin: 0; font-size: 18px; }
  .close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--chip); display: grid; place-items: center; color: var(--ink); }
  .close svg { width: 18px; height: 18px; }
  .sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; background: var(--surface); }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }

  /* item detail */
  .detail-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--chip); }
  .detail-ph { width: 100%; aspect-ratio: 16/7; display: grid; place-items: center; background: var(--chip); color: var(--muted-2); }
  .detail-ph svg { width: 56px; height: 56px; }
  .detail-close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.15); z-index: 2; }
  .detail-main { padding: 16px; }
  .detail-main h3 { margin: 0; font-size: 20px; }
  .detail-main p { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .detail-main .price { margin-top: 10px; font-weight: 800; font-size: 18px; }
  .group { border-top: 8px solid var(--bg); padding: 14px 16px 6px; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .group-head b { font-size: 16px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .badge.req { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.req.ok { background: #e6f4ea; color: #1e7a3c; }
  .choice { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; cursor: pointer; }
  .choice:last-child { border-bottom: 0; }
  .choice .txt { flex: 1; }
  .choice em { font-style: normal; color: var(--muted); font-size: 14px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .mark { width: 22px; height: 22px; border: 2px solid var(--muted-2); border-radius: 50%; flex: none; display: grid; place-items: center; transition: all .15s; }
  .mark.box { border-radius: 6px; }
  .choice input:checked + .mark { border-color: var(--accent); background: var(--accent); }
  .choice input:checked + .mark::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .note-wrap { border-top: 8px solid var(--bg); padding: 14px 16px 18px; }
  .note-wrap b { font-size: 16px; display: block; margin-bottom: 8px; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; resize: none; background: var(--bg); color: var(--ink); }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .stepper { display: flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px; padding: 3px; flex: none; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .stepper button:disabled { opacity: .4; }
  .stepper button svg { width: 16px; height: 16px; }
  .stepper span { min-width: 30px; text-align: center; font-weight: 700; }
  .stepper.sm button { width: 28px; height: 28px; }
  .stepper.sm span { min-width: 24px; font-size: 14px; }
  .primary { flex: 1; border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; padding: 14px 16px; border-radius: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .primary.center { justify-content: center; }
  .primary:disabled { background: var(--muted-2); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  .serve { border-top: 8px solid var(--bg); padding: 14px 16px; }
  .serve b { font-size: 16px; display: block; margin-bottom: 10px; }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--chip); padding: 4px; border-radius: 14px; }
  .seg2 button { border: 0; background: none; padding: 11px; border-radius: 11px; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; }
  .seg2 button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg2 button.on.ta { color: var(--accent-ink); }
  .ta-tag { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); padding: 1px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
  .void-tag { display: inline-block; font-size: 11px; font-weight: 800; color: #b42318; background: #fde2e1; padding: 1px 7px; border-radius: 6px; margin-left: 6px; }
  .hist.void .receipt-row { color: var(--muted-2); text-decoration: line-through; }
  .hist.void .receipt-row .o { text-decoration: none; }
  .void-note { margin: 0; padding: 8px 14px; font-size: 13px; color: #b42318; background: #fff5f4; }
  .htabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; margin: 0 16px 8px; }
  .htabs button { border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .htabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .st { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .st.new { background: #fff4d6; color: #8a5a00; }
  .st.done { background: #e6f4ea; color: #1e7a3c; }
  .table-sum { margin: 12px 16px; padding: 14px; border-radius: 14px; background: var(--ink); color: var(--surface); display: flex; justify-content: space-between; font-weight: 800; font-size: 17px; }
  .busy { margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; background: #fff4d6; color: #7a4f00; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; font-weight: 600; }
  .busy svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .busy.lv2 { background: #fde2e1; color: #9a2a1d; }
  .reason { display: flex; align-items: center; width: calc(100% - 32px); margin: 0 16px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 15px 16px; font-size: 16px; font-weight: 700; text-align: left; }
  .reason:active { background: var(--chip); }
  .sheet-sub { padding: 0 16px 10px; color: var(--muted); font-size: 14px; margin: 0; }
  .rm-line { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .rm-line input { position: absolute; opacity: 0; pointer-events: none; }
  .rm-line .info { flex: 1; min-width: 0; }
  .rm-line .sub { font-size: 13px; color: var(--muted); }
  .rm-line.wait { cursor: default; opacity: .6; }
  .rm-line.wait .mark { border-style: dashed; }
  .rm-line input:checked + .mark { border-color: var(--accent); background: var(--accent); }
  .rm-line input:checked + .mark::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .remind-cta { display: flex; align-items: center; gap: 10px; width: calc(100% - 32px); margin: 4px 16px 12px; border: 0; background: var(--accent); color: #fff; font-weight: 800; font-size: 15px; padding: 13px 14px; border-radius: 14px; text-align: left; box-shadow: 0 4px 12px rgba(226,85,43,.25); }
  .remind-cta span { flex: 1; }
  .remind-cta .chev { width: 18px; height: 18px; opacity: .9; }
  .remind-cta svg { width: 18px; height: 18px; }
  /* cart */
  .cart-line { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .cart-line .info { flex: 1; min-width: 0; }
  .cart-line .nm { font-weight: 700; }
  .cart-line .opts { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .cart-line .nt { font-size: 13px; color: var(--accent-ink); margin-top: 3px; }
  .cart-line .pr { font-weight: 700; margin-top: 6px; }
  .summary { padding: 14px 16px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; }
  .pay-hint { margin: 0 16px 16px; padding: 10px 12px; border-radius: 12px; background: var(--bg); color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .pay-hint svg { width: 18px; height: 18px; flex: none; }
  .link-btn { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 8px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* success */
  .success { position: fixed; inset: 0; z-index: 60; background: var(--surface); display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 48px 20px calc(24px + env(safe-area-inset-bottom)); }
  .success.show { display: flex; }
  .success { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
  body.success-open #app, body.success-open .cartbar { visibility: hidden; }
  .tick { width: 84px; height: 84px; border-radius: 50%; background: #e6f4ea; display: grid; place-items: center; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  .tick svg { width: 44px; height: 44px; color: #1e9e4a; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .4s .25s forwards; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .success h2 { font-size: 24px; margin: 20px 0 6px; text-align: center; }
  .success .sub { color: var(--muted); text-align: center; margin: 0; }
  .pay-card { width: 100%; max-width: 420px; margin: 22px 0; border-radius: 18px; background: var(--accent-soft); color: var(--accent-ink); padding: 16px; display: flex; gap: 12px; align-items: center; font-weight: 600; }
  .pay-card svg { width: 30px; height: 30px; flex: none; }
  .receipt { width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
  .receipt-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .receipt-row:last-child { border-bottom: 0; }
  .receipt-row .o { color: var(--muted); font-size: 12px; }
  .receipt-row.tot { font-weight: 800; font-size: 16px; }
  .success-actions { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; padding: 13px; border-radius: 14px; }

  /* history */
  .hist { margin: 12px 16px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .hist-head { display: flex; justify-content: space-between; padding: 12px 14px; background: var(--bg); font-size: 14px; }
  .hist-head b { font-size: 15px; }
  .hist .receipt-row { padding: 10px 14px; }

  /* language menu */
  .lang-menu { position: absolute; right: 16px; top: 64px; z-index: 70; background: var(--surface); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: none; min-width: 160px; }
  .lang-menu.show { display: block; }
  .lang-menu button { display: flex; width: 100%; justify-content: space-between; border: 0; background: none; padding: 11px 12px; border-radius: 10px; font-size: 15px; color: var(--ink); }
  .lang-menu button.on { background: var(--chip); font-weight: 700; }

  .toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -150%); z-index: 90; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: transform .25s; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { transform: translate(-50%, 0); }
  .fatal { padding: 80px 24px; text-align: center; }

async function openRemind() {

  const now = Date.now() + skew;
  const lines = histOrders.filter((o) => o.status !== 'void').flatMap((o) => o.lines.map((l, i) => {
    const due = o.createdAt + ((l.cookMinutes || 15) + busy.extra) * 60000;
    const rem = reminders[o.id + ':' + i]; const coolLeft = rem ? rem.at + remindCool - now : 0;
    return { o, l, i, rem, cooling: coolLeft > 0, coolMin: Math.max(1, Math.ceil(coolLeft / 60000)), overdue: now >= due, mins: Math.max(1, Math.ceil((due - now) / 60000)) };
  }));
  const ok = (x) => x.overdue && !x.cooling;
  const any = lines.some(ok);
  const sub = (x) => x.cooling ? `<span class="again">${esc(t('againIn').replace('{m}', x.coolMin))}</span>` : x.overdue || config.showCookTime === false ? '' : esc(t('usually').replace('{m}', x.mins));

    <div class="sheet-body">${lines.map((x) => { const s2 = sub(x); return `<label class="rm-line${ok(x) ? '' : ' wait'}"><input type="checkbox" ${ok(x) ? '' : 'disabled'} data-o="${x.o.id}" data-i="${x.i}"><span class="mark box"></span>

  const w = p.r * 1.3, h = p.r * 1.9; g.save(); g.translate(p.x, p.y); g.rotate(p.rot + Math.sin(p.a * 1.3) * .35); g.globalAlpha = .95;
  g.fillStyle = '#d7191f'; g.beginPath(); g.roundRect ? g.roundRect(-w / 2, -h / 2, w, h, w * .14) : g.rect(-w / 2, -h / 2, w, h); g.fill(); g.strokeStyle = '#f5c542'; g.lineWidth = .7; g.stroke();
  g.fillStyle = '#b10f16'; g.beginPath(); g.moveTo(-w / 2, -h / 2); g.lineTo(w / 2, -h / 2); g.lineTo(w / 2, -h * .12); g.quadraticCurveTo(0, h * .08, -w / 2, -h * .12); g.closePath(); g.fill();
  g.fillStyle = '#ffd24a'; g.beginPath(); g.arc(0, -h * .02, w * .2, 0, 7); g.fill(); g.restore(); }
function confetti(g, p) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.a * 2)); g.fillStyle = p.c; g.globalAlpha = .95; g.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9); g.restore(); }
function star(g, p) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.globalAlpha = .55 + .45 * Math.abs(Math.sin(p.a * 2)); g.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? p.r * .45 : p.r; g.lineTo(Math.cos(i * Math.PI / 5 - Math.PI / 2) * r, Math.sin(i * Math.PI / 5 - Math.PI / 2) * r); } g.fill(); g.restore(); }
let fxRuns = [];
function fxRun(cv, kind, { scale = 1, until = Infinity, banner = false } = {}) {
  const k = FX[kind]; if (!k || !cv) return; const g = cv.getContext('2d'); const dpr = Math.min(2, window.devicePixelRatio || 1);
  let w = 0, h = 0; const size = () => { w = cv.clientWidth; h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }; size();
  const n = Math.round(k.n * scale); const ps = Array.from({ length: n }, () => { const p = k.make(w, h); p.y = Math.random() * h; return p; });
  const run = { stop: false }; if (banner) fxRuns.push(run); const t0 = performance.now();
  const tick = (now) => {
    if (run.stop || !cv.isConnected) return;
    if (cv.clientWidth !== w || cv.clientHeight !== h) size();
    g.clearRect(0, 0, w, h); const ending = now - t0 > until;
    for (const p of ps) {
      p.a += .02; p.y += p.vy; p.x += Math.sin(p.a) * .45; if (p.vr) p.rot += p.vr;
      const out = k.up ? p.y < -12 : p.y > h + 12;
      if (out) { if (ending) { p.dead = true; continue; } Object.assign(p, k.make(w, h)); }
      if (!p.dead) k.draw(g, p);

let fxPageShown = false;
function startFx() {
  fxRuns.forEach((r) => r.stop = true); fxRuns = [];

  const cv = document.querySelector('#festBar canvas'); if (cv) fxRun(cv, theme, { scale: .5, banner: true });
  if (!fxPageShown) { fxPageShown = true; fxShower(7000); } // a gentle shower over the whole page for the first few seconds only, so the menu stays easy to read
}
function fxShower(ms, onTop) {
  if (!effects || !FX[theme] || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.getElementById('fxPage')?.remove();
  const pc = document.createElement('canvas'); pc.id = 'fxPage'; if (onTop) pc.className = 'top'; document.body.appendChild(pc); fxRun(pc, theme, { scale: 1, until: ms });
}

// ---------------- kitchen busy notice ----------------
function busyHTML() {
  if (!busy.level) return '';
  return `<div class="busy lv${busy.level}">${ICON.clock}<span>${esc(t(busy.level === 2 ? 'busy2' : 'busy1').replace('{m}', busy.extra))}</span></div>`;
}
async function checkSeat() {
  if (!seat || seatClosed) return;
  try { const r = await api('/api/seat?key=' + encodeURIComponent(seat.key) + '&clientId=' + encodeURIComponent(clientId)); skew = r.now - Date.now();
    if (r.busy.level !== busy.level || r.busy.extra !== busy.extra) { busy = r.busy; if ($('busyBar')) $('busyBar').innerHTML = busyHTML(); }
    if (r.orderCount !== orderCount || r.allCount !== allCount) { orderCount = r.orderCount; allCount = r.allCount; renderOrdersBtn(); }
    if (themeSig(r) !== themeSig({ theme, banner, effects })) { theme = r.theme; banner = r.banner; effects = r.effects; applyTheme(); }
    applyAvail(r.avail);
    return true;
  } catch (e) { if (e.status === 410) { showClosed(); return false; } }
}
setInterval(() => { if (document.visibilityState === 'visible') checkSeat(); }, 3000); // light request: busy notice + table-cleared check

// ---------------- misc ----------------
let toastTimer;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200); }
async function reloadMenu() {
  menu = (await api('/api/menu?clientId=' + encodeURIComponent(clientId) + (seat ? '&key=' + encodeURIComponent(seat.key) : ''))).categories;
  itemsById = new Map(menu.flatMap((c) => c.items).map((i) => [i.id, i]));
  cart = cart.filter((l) => itemsById.has(l.itemId) && !itemsById.get(l.itemId).soldOut);
  store.set(cartKey, cart);
  if ($('tabs')) renderPage();
}
function fatal() {
  $('app').innerHTML = `<div class="fatal"><div style="color:var(--muted-2)">${ICON.dish.replace('<svg', '<svg width="64" height="64"')}</div><h2>${esc(t('badTable'))}</h2><p>${esc(t('badTableSub'))}</p>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:center">${LANGS.map(([k, n]) => `<button class="icon-btn" onclick="lang='${k}';store.set('lang',lang);fatal()">${n}</button>`).join('')}</div></div>`;
}
// Shown when the table was cleared (or the seat expired): the guest must scan the physical QR code again.
function showClosed() {
  seatClosed = true; closeSheets();
  if (seat) { try { localStorage.removeItem('cart:' + seat.key); localStorage.removeItem('seat'); } catch {} }
  cart = []; $('cartbar').classList.remove('show'); $('success').classList.remove('show'); document.body.classList.remove('success-open');
  document.title = config.name || 'Menu'; window.scrollTo(0, 0);
  $('app').innerHTML = `<div class="fatal"><div class="tick" style="margin:0 auto">${ICON.check}</div><h2>${esc(t('closedT'))}</h2><p>${esc(t('closedS'))}</p>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${LANGS.map(([k, n]) => `<button class="icon-btn" onclick="lang='${k}';store.set('lang',lang);showClosed()">${n}</button>`).join('')}</div></div>`;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
// When the guest comes back to the tab: check the table is still open, refresh sold-out status.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !table || seatClosed) return;
  if (await checkSeat()) reloadMenu().catch(() => {});
});

(async function init() {
  try {
    config = await api('/api/config');
    const m = /^\/t\/([\w-]{6,40})$/.exec(location.pathname);
    if (m) {
      // Fresh QR scan: join the table's dining session, then drop the QR token from the address bar and
      // browser history, so reopening this page later from history can't order once the table is cleared.
      const r = await api('/api/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: m[1] }) });
      if (!seat || seat.key !== r.seat) { seat = { key: r.seat, table: r.table }; store.set('seat', seat); }
      history.replaceState(null, '', '/o');
    } else if (!seat) return showClosed();

    table = { name: seat.table };
    const st = await api('/api/seat?key=' + encodeURIComponent(seat.key) + '&clientId=' + encodeURIComponent(clientId)); busy = st.busy; skew = st.now - Date.now(); orderCount = st.orderCount; allCount = st.allCount; theme = st.theme; banner = st.banner; effects = st.effects;
    cartKey = 'cart:' + seat.key; cart = store.get(cartKey, []);
  } catch (e) { if (e.status === 404) return fatal(); if (e.status === 410) return showClosed(); $('app').innerHTML = `<div class="fatal"><h2>${esc(t('netErr'))}</h2><button class="primary center" style="max-width:240px;margin:20px auto" onclick="location.reload()">↻</button></div>`; return; }
  await reloadMenu(); renderPage();
})();
</script>
